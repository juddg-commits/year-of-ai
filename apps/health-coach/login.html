<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach · Sign in</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#090b0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<style>
  :root { --bg: #090b0e; --ink: #eef1f4; --muted: #8a93a3; --line: rgba(255,255,255,.08);
          --accent: #4ade80; --danger: #f87171; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 60% at 50% 0%, #10231a 0%, var(--bg) 60%);
    color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: grid; place-items: center; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { width: min(100%, 360px); text-align: center; }
  img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 12px 40px rgba(74,222,128,.18); }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: .04em; margin: 18px 0 4px; }
  h1 span { color: var(--accent); }
  p { color: var(--muted); font-size: 15px; margin-bottom: 26px; }
  form { display: grid; gap: 12px; }
  input {
    width: 100%; padding: 15px 16px; font-size: 16px; color: var(--ink);
    background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(74,222,128,.12); }
  button {
    padding: 15px; border: 0; border-radius: 14px; font: inherit; font-weight: 800;
    background: var(--accent); color: #05130a; cursor: pointer;
  }
  .error { color: var(--danger); font-size: 14px; min-height: 21px; }
</style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="">
    <h1>COACH<span>.</span></h1>
    <p>Your trainer, your data. Sign in to continue.</p>
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
      <div class="error" role="alert">{{error}}</div>
    </form>
  </main>
</body>
</html>
